# For Coolify: add this repo as a Docker Compose resource, set API_KEY in its environment
# variables, and give the app service a domain on port 3000.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      RENDER_RETENTION_DAYS: ${RENDER_RETENTION_DAYS:-14}
      RENDERS_PER_MIN: ${RENDERS_PER_MIN:-30}
      TEMPLATE_VERSIONS_KEEP: ${TEMPLATE_VERSIONS_KEEP:-50}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MONTHLY_CAP_GBP: ${CLAUDE_MONTHLY_CAP_GBP:-20}
      GBP_PER_USD: ${GBP_PER_USD:-0.79}
      BUFFER_API_KEY: ${BUFFER_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      AUTO_POST: ${AUTO_POST:-false}
      PUBLISH_DIR: ${PUBLISH_DIR:-/data/site}
      SITE_URL: ${SITE_URL:-https://redcherryit.com}
    volumes:
      - data:/data
    expose:
      - "3000"
    shm_size: 256mb # Chromium needs more shared memory than Docker's 64 MB default

volumes:
  data:
