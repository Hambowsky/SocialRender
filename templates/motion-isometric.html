<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion: isometric scene</title>
<script type="application/json" id="sample">{"headline": "Slow hosting costs you customers", "highlight_word": "hosting", "subtitle": "Cheap shared servers slow your site down at busy times. Good hosting keeps it fast when it matters.", "tag": "Web Hosting", "footer_left": "Hosting explained", "footer_right": "redcherryit.com"}</script>
<style>
  @font-face { font-family: "Archivo"; font-weight: 400; src: url(/fonts/archivo-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 500; src: url(/fonts/archivo-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 900; src: url(/fonts/archivo-latin-900-normal.woff2) format("woff2"); }
  :root { --red: #b5333f; --ink: #1a1a1a; --grey: #444; --logo-grey: #a89c9c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e9e9; }
  .post {
    width: 1080px; height: 1920px; position: relative; overflow: hidden; display: flex; flex-direction: column;
    padding: 0 88px; color: var(--ink); font-family: "Archivo", "Arial Black", Arial, sans-serif;
    background: radial-gradient(800px 640px at 50% 560px, #fff 0%, rgba(255, 255, 255, 0) 70%), #f3eeef;
  }

  .logo { position: absolute; left: 88px; top: 96px; width: 340px; height: auto; }
  .tag { position: absolute; right: 88px; top: 118px; font-weight: 500; font-size: 24px; letter-spacing: 5px; line-height: 1;
         color: var(--red); text-transform: uppercase; white-space: nowrap; }

  .scene { flex: none; width: 1080px; height: 860px; margin: 230px -88px 0; overflow: visible; }
  .scene g, .scene path, .scene polygon { transform-box: fill-box; }
  .float { animation: bob 4s ease-in-out 3; }
  .drop { opacity: 0; animation: drop .9s cubic-bezier(.2, .9, .3, 1.15) .4s forwards; }
  .rack { transform-origin: bottom; transform: scaleY(0); animation: rise .8s cubic-bezier(.2, .9, .3, 1.1) forwards; }
  .led { fill: var(--red); animation: blink 1.2s steps(2) 5.6s 5; }
  .shadow { fill: #1a1a1a; opacity: 0; animation: shade .9s ease-out .4s forwards; }
  .path { fill: none; stroke: var(--red); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 14 14;
          opacity: 0; animation: fade .4s ease-out 3s forwards, flow 1s linear 3s 9; }
  .pin { opacity: 0; transform-origin: bottom; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) forwards; }
  .callout rect { fill: #fff; stroke: #1a1a1a1a; stroke-width: 2; filter: drop-shadow(0 14px 22px #1a1a1a22); }
  .callout text { font: 500 24px Archivo, Arial, sans-serif; letter-spacing: 3px; fill: var(--ink); text-transform: uppercase; }
  .callout .live { fill: var(--red); }

  .bar { flex: none; width: 180px; height: 6px; margin-top: 40px; background: var(--red);
         transform-origin: left; transform: scaleX(0); animation: grow .6s ease-out 4.4s forwards; }
  h1 { margin-top: 34px; font-weight: 900; font-size: 98px; line-height: 1.04; letter-spacing: -3px;
       opacity: 0; animation: up .8s ease-out 4.7s forwards; }
  h1 .hl { color: var(--red); }
  .sub { margin-top: 30px; font-weight: 400; font-size: 40px; line-height: 1.4; color: var(--grey);
         opacity: 0; animation: up .8s ease-out 5.6s forwards; }

  .rule { position: absolute; left: 88px; right: 88px; top: 1760px; height: 2px; background: #111; }
  .foot-l { position: absolute; left: 88px; top: 1806px; font-weight: 900; font-size: 30px; white-space: nowrap; }
  .foot-r { position: absolute; right: 88px; top: 1806px; font-weight: 500; font-size: 30px; color: var(--red); white-space: nowrap; }
  .logo, .tag, .rule, .foot-l, .foot-r { opacity: 0; animation: fade .8s ease-out .2s forwards; }
  .rule, .foot-l, .foot-r { animation-delay: 6.4s; }

  @keyframes bob { 0%, 100% { transform: none; } 50% { transform: translateY(-16px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-120px); } to { opacity: 1; transform: none; } }
  @keyframes shade { to { opacity: .1; } }
  @keyframes rise { to { transform: none; } }
  @keyframes blink { 0% { fill: var(--red); } 100% { fill: #ff8a94; } }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5) translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleX(1); } }
  /* Other sizes: the same design with the scene shrunk and the text a little smaller.
     The renderer sets data-size on .post. Zoom scales the scene's margins too, so they are divided by it. */
  .post[data-size="1080x1350"] { height: 1350px; }
  .post[data-size="1080x1350"] .scene { zoom: .55; margin: 382px auto 0; }
  .post[data-size="1080x1350"] .bar { margin-top: 28px; }
  .post[data-size="1080x1350"] h1 { margin-top: 26px; font-size: 82px; }
  .post[data-size="1080x1350"] .sub { margin-top: 24px; font-size: 34px; }
  .post[data-size="1080x1350"] .rule { top: 1190px; }
  .post[data-size="1080x1350"] :is(.foot-l, .foot-r) { top: 1236px; font-size: 28px; }
  .post[data-size="1080x1080"] { height: 1080px; }
  .post[data-size="1080x1080"] .scene { zoom: .4; margin: 512px auto 0; }
  .post[data-size="1080x1080"] .bar { margin-top: 24px; }
  .post[data-size="1080x1080"] h1 { margin-top: 22px; font-size: 66px; letter-spacing: -2px; }
  .post[data-size="1080x1080"] .sub { margin-top: 18px; font-size: 28px; }
  .post[data-size="1080x1080"] .rule { top: 920px; }
  .post[data-size="1080x1080"] :is(.foot-l, .foot-r) { top: 958px; font-size: 26px; }
</style>
</head>
<body>
  <div class="post" data-size="1080x1920" data-sizes="1080x1920 1080x1350 1080x1080" data-seconds="12">
    <img class="logo" src="/assets/logo.png" alt="Red Cherry IT">
    <div class="tag" data-field="tag">{{tag}}</div>

    <svg class="scene" viewBox="0 0 1080 860">
      <ellipse class="shadow" cx="590" cy="770" rx="330" ry="56"/>
      <g class="float"><g class="drop">
        <!-- main tile -->
        <polygon fill="#d9d0d1" points="230,470 590,650 590,694 230,514"/>
        <polygon fill="#c4b8b9" points="590,650 950,470 950,514 590,694"/>
        <polygon fill="#ffffff" points="590,290 950,470 590,650 230,470"/>
        <polygon fill="none" stroke="#1a1a1a14" stroke-width="2" points="590,330 870,470 590,610 310,470"/>

        <!-- back rack -->
        <g class="rack" style="animation-delay:1.1s">
          <polygon fill="#2c2c2c" points="490,430 570,470 570,230 490,190"/>
          <polygon fill="#1a1a1a" points="570,470 650,430 650,190 570,230"/>
          <polygon fill="#3d3d3d" points="490,190 570,230 650,190 570,150"/>
          <g stroke="#ffffff22" stroke-width="3">
            <path d="M500 230 L560 260 M500 270 L560 300 M500 310 L560 340 M500 350 L560 380 M500 390 L560 420"/>
          </g>
          <polygon class="led" points="538,242 552,249 552,257 538,250"/>
          <polygon class="led" style="animation-delay:5.9s" points="538,322 552,329 552,337 538,330"/>
          <polygon class="led" style="animation-delay:6.2s" points="538,402 552,409 552,417 538,410"/>
        </g>
        <!-- front rack -->
        <g class="rack" style="animation-delay:1.5s">
          <polygon fill="#2c2c2c" points="610,500 690,540 690,360 610,320"/>
          <polygon fill="#1a1a1a" points="690,540 770,500 770,320 690,360"/>
          <polygon fill="#b5333f" points="610,320 690,360 770,320 690,280"/>
          <g stroke="#ffffff22" stroke-width="3">
            <path d="M620 360 L680 390 M620 400 L680 430 M620 440 L680 470"/>
          </g>
          <polygon class="led" style="animation-delay:6s" points="658,372 672,379 672,387 658,380"/>
          <polygon class="led" style="animation-delay:6.4s" points="658,452 672,459 672,467 658,460"/>
        </g>
      </g></g>

      <!-- dashed route from the visitor's laptop to the servers -->
      <path class="path" d="M300 690 C 330 640, 340 600, 400 560"/>

      <g class="pin" style="animation-delay:2.3s">
        <polygon fill="#d9d0d1" points="120,720 230,775 230,795 120,740"/>
        <polygon fill="#c4b8b9" points="230,775 340,720 340,740 230,795"/>
        <polygon fill="#ffffff" points="230,665 340,720 230,775 120,720"/>
        <polygon fill="#2c2c2c" points="180,722 230,747 280,722 230,697"/>
        <polygon fill="#1a1a1a" points="180,722 230,697 230,617 180,642"/>
        <polygon fill="#b5333f" points="187,712 223,694 223,628 187,646"/>
      </g>

      <g class="pin callout" style="animation-delay:2.8s">
        <rect x="650" y="40" width="360" height="92" rx="20"/>
        <circle class="live" cx="690" cy="86" r="10"/>
        <text x="716" y="95">Site online</text>
        <path d="M760 132 L780 160 L800 132" fill="#fff"/>
      </g>
    </svg>

    <div class="bar"></div>
    <h1 data-field="headline">{{headline}}</h1>
    <p class="sub" data-field="subtitle">{{subtitle}}</p>

    <div class="rule"></div>
    <div class="foot-l" data-field="footer_left">{{footer_left}}</div>
    <div class="foot-r" data-field="footer_right">{{footer_right}}</div>
  </div>
</body>
</html>
