<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social post</title>
<script type="application/json" id="sample">{"headline": "Why speed matters. Fast sites explained", "highlight_word": "speed", "subtitle": "How page load time affects your Google rankings and customer enquiries, and what small businesses can do to fix it.", "tag": "Marketing Guide", "footer_left": "Website speed explained. Free guide", "footer_right": "redcherryit.com"}</script>
<style>
  @font-face { font-family: "Archivo"; font-weight: 400; src: url(/fonts/archivo-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 500; src: url(/fonts/archivo-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 900; src: url(/fonts/archivo-latin-900-normal.woff2) format("woff2"); }
  :root { --red: #b5333f; --ink: #1a1a1a; --grey: #444; --logo-grey: #a89c9c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e9e9; }
  .post {
    width: 1080px; height: 1080px; background: #fff; position: relative; overflow: hidden;
    font-family: "Archivo", "Arial Black", Arial, sans-serif; color: var(--ink);
  }

  /* shared frame: logo, tag, footer */
  .logo { position: absolute; left: 88px; top: 88px; width: 372px; height: auto; }
  .tag {
    position: absolute; right: 88px; top: 108px;
    font-weight: 500; font-size: 22px; letter-spacing: 5px; line-height: 1;
    color: var(--red); text-transform: uppercase; white-space: nowrap;
  }
  .rule { position: absolute; left: 88px; right: 88px; top: 915px; height: 2px; background: #111; }
  .foot-l { position: absolute; left: 88px; top: 960px; font-weight: 900; font-size: 27px; white-space: nowrap; }
  .foot-r { position: absolute; right: 88px; top: 960px; font-weight: 500; font-size: 27px; color: var(--red); white-space: nowrap; }

  .bar { position: absolute; left: 88px; top: 290px; width: 180px; height: 6px; background: var(--red); }
  h1 { position: absolute; left: 88px; top: 335px; width: 900px;
       font-weight: 900; font-size: 92px; line-height: 1.04; letter-spacing: -3px; }
  h1 .hl { color: var(--red); }
  .sub { position: absolute; left: 88px; top: 690px; width: 820px;
         font-weight: 400; font-size: 31px; line-height: 1.45; color: var(--grey); }
</style>
</head>
<body>
  <div class="post">
    <img class="logo" src="/assets/logo.png" alt="Red Cherry IT">
    <div class="tag" data-field="tag">{{tag}}</div>

    <div class="bar"></div>
    <h1 data-field="headline">{{headline}}</h1>
    <p class="sub" data-field="subtitle">{{subtitle}}</p>

    <div class="rule"></div>
    <div class="foot-l" data-field="footer_left">{{footer_left}}</div>
    <div class="foot-r" data-field="footer_right">{{footer_right}}</div>
  </div>
</body>
</html>
