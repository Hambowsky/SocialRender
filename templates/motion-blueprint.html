<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion: blueprint</title>
<script type="application/json" id="sample">{"headline": "Plan your website before you build it", "highlight_word": "Plan", "subtitle": "A clear page plan saves weeks of changes later and makes sure every page has a job to do.", "tag": "Web Design", "footer_left": "How we plan a site", "footer_right": "redcherryit.com"}</script>
<style>
  @font-face { font-family: "Archivo"; font-weight: 400; src: url(/fonts/archivo-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 500; src: url(/fonts/archivo-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Archivo"; font-weight: 900; src: url(/fonts/archivo-latin-900-normal.woff2) format("woff2"); }
  :root { --red: #b5333f; --ink: #1a1a1a; --logo-grey: #a89c9c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e9e9e9; }
  /* a blueprint in brand red: fine grid every 40px, heavier every 200px */
  .post {
    width: 1080px; height: 1920px; position: relative; overflow: hidden; display: flex; flex-direction: column;
    padding: 0 88px; color: #fff; font-family: "Archivo", "Arial Black", Arial, sans-serif;
    background:
      linear-gradient(#ffffff26 2px, transparent 2px) -1px -1px / 200px 200px,
      linear-gradient(90deg, #ffffff26 2px, transparent 2px) -1px -1px / 200px 200px,
      linear-gradient(#ffffff12 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, #ffffff12 1px, transparent 1px) 0 0 / 40px 40px,
      radial-gradient(1100px 900px at 50% 40%, #a8303b, #7e222c);
  }

  .logo { position: absolute; left: 88px; top: 92px; background: #fff; border-radius: 999px; padding: 20px 30px; line-height: 0; }
  .logo img { width: 300px; height: auto; }
  .tag { position: absolute; right: 88px; top: 112px; font-weight: 500; font-size: 24px; letter-spacing: 5px; line-height: 1;
         color: #fff; text-transform: uppercase; white-space: nowrap; border: 2px solid #ffffffaa; padding: 12px 18px; }

  .scene { flex: none; width: 1080px; height: 860px; margin: 230px -88px 0; overflow: visible; }
  .ln { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 1.2s ease-in-out forwards; }
  .thin { stroke-width: 2; opacity: .75; }
  .dim { stroke-width: 2; opacity: .85; }
  .note { fill: #fff; font: 500 22px Archivo, Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; opacity: 0;
          animation: fade .6s ease-out forwards; }
  .block text { font-size: 20px; }
  .block .big { font: 900 30px Archivo, Arial, sans-serif; letter-spacing: 1px; }
  .detail { transform-box: fill-box; transform-origin: center; }

  .bar { flex: none; width: 180px; height: 6px; margin-top: 40px; background: #fff;
         transform-origin: left; transform: scaleX(0); animation: grow .6s ease-out 5s forwards; }
  h1 { margin-top: 34px; font-weight: 900; font-size: 98px; line-height: 1.1; letter-spacing: -3px;
       opacity: 0; animation: up .8s ease-out 5.3s forwards; }
  h1 .hl { color: var(--red); background: #fff; padding: 0 14px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sub { margin-top: 30px; font-weight: 400; font-size: 40px; line-height: 1.4; color: #f7e3e5;
         opacity: 0; animation: up .8s ease-out 6.1s forwards; }

  .rule { position: absolute; left: 88px; right: 88px; top: 1760px; height: 2px; background: #ffffff88; }
  .foot-l { position: absolute; left: 88px; top: 1806px; font-weight: 900; font-size: 30px; white-space: nowrap; }
  .foot-r { position: absolute; right: 88px; top: 1806px; font-weight: 500; font-size: 30px; white-space: nowrap;
            text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 2px; }
  .logo, .tag, .rule, .foot-l, .foot-r { opacity: 0; animation: fade .8s ease-out .2s forwards; }
  .rule, .foot-l, .foot-r { animation-delay: 6.8s; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes grow { to { transform: scaleX(1); } }
  /* Other sizes: the same design with the scene shrunk and the text a little smaller.
     The renderer sets data-size on .post. Zoom scales the scene's margins too, so they are divided by it. */
  .post[data-size="1080x1350"] { height: 1350px; }
  .post[data-size="1080x1350"] .scene { zoom: .55; margin: 382px auto 0; }
  .post[data-size="1080x1350"] .bar { margin-top: 28px; }
  .post[data-size="1080x1350"] h1 { margin-top: 26px; font-size: 82px; }
  .post[data-size="1080x1350"] .sub { margin-top: 24px; font-size: 34px; }
  .post[data-size="1080x1350"] .rule { top: 1190px; }
  .post[data-size="1080x1350"] :is(.foot-l, .foot-r) { top: 1236px; font-size: 28px; }
  .post[data-size="1080x1080"] { height: 1080px; }
  .post[data-size="1080x1080"] .scene { zoom: .4; margin: 512px auto 0; }
  .post[data-size="1080x1080"] .bar { margin-top: 24px; }
  .post[data-size="1080x1080"] h1 { margin-top: 22px; font-size: 66px; letter-spacing: -2px; }
  .post[data-size="1080x1080"] .sub { margin-top: 18px; font-size: 28px; }
  .post[data-size="1080x1080"] .rule { top: 920px; }
  .post[data-size="1080x1080"] :is(.foot-l, .foot-r) { top: 958px; font-size: 26px; }
</style>
</head>
<body>
  <div class="post" data-size="1080x1920" data-sizes="1080x1920 1080x1350 1080x1080" data-seconds="12">
    <div class="logo"><img src="/assets/logo.png" alt="Red Cherry IT"></div>
    <div class="tag" data-field="tag">{{tag}}</div>

    <svg class="scene" viewBox="0 0 1080 860">
      <!-- desktop page -->
      <rect class="ln" pathLength="1" style="animation-delay:.4s" x="100" y="120" width="660" height="460" rx="10"/>
      <path class="ln" pathLength="1" style="animation-delay:1s" d="M100 170 H760"/>
      <circle class="ln thin" pathLength="1" style="animation-delay:1.1s" cx="130" cy="145" r="8"/>
      <circle class="ln thin" pathLength="1" style="animation-delay:1.2s" cx="158" cy="145" r="8"/>
      <circle class="ln thin" pathLength="1" style="animation-delay:1.3s" cx="186" cy="145" r="8"/>
      <rect class="ln thin" pathLength="1" style="animation-delay:1.4s" x="130" y="200" width="600" height="150"/>
      <path class="ln thin" pathLength="1" style="animation-delay:1.8s" d="M130 200 L730 350 M730 200 L130 350"/>
      <path class="ln" pathLength="1" style="animation-delay:2s" d="M130 384 H470 M130 414 H390"/>
      <rect class="ln thin" pathLength="1" style="animation-delay:2.2s" x="130" y="450" width="180" height="100"/>
      <rect class="ln thin" pathLength="1" style="animation-delay:2.35s" x="340" y="450" width="180" height="100"/>
      <rect class="ln thin" pathLength="1" style="animation-delay:2.5s" x="550" y="450" width="180" height="100"/>

      <!-- phone -->
      <rect class="ln" pathLength="1" style="animation-delay:1.6s" x="820" y="230" width="170" height="350" rx="26"/>
      <path class="ln thin" pathLength="1" style="animation-delay:2.4s" d="M880 252 H930 M842 290 H968 M842 380 H968 M842 410 H940 M842 440 H968 M842 470 H920"/>
      <rect class="ln thin" pathLength="1" style="animation-delay:2.6s" x="842" y="300" width="126" height="64"/>

      <!-- dimensions -->
      <path class="ln dim" pathLength="1" style="animation-delay:2.8s" d="M100 70 V100 M760 70 V100 M100 85 H760 M100 85 l16 -8 M100 85 l16 8 M760 85 l-16 -8 M760 85 l-16 8"/>
      <text class="note" x="430" y="70" text-anchor="middle" style="animation-delay:3.2s">1440 px</text>
      <path class="ln dim" pathLength="1" style="animation-delay:3s" d="M1020 230 H1040 M1020 580 H1040 M1030 230 V580 M1030 230 l-8 16 M1030 230 l8 16 M1030 580 l-8 -16 M1030 580 l8 -16"/>
      <text class="note" style="animation-delay:3.4s" transform="translate(1062 405) rotate(-90)" text-anchor="middle">Mobile</text>

      <!-- detail callout on the hero -->
      <circle class="ln dim" pathLength="1" style="animation-delay:3.4s" cx="430" cy="275" r="58"/>
      <path class="ln dim" pathLength="1" style="animation-delay:3.7s" d="M388 316 L300 640 H130"/>
      <text class="note" x="130" y="676" style="animation-delay:4s">A. Main message</text>

      <!-- title block -->
      <g class="block">
        <rect class="ln" pathLength="1" style="animation-delay:3.6s" x="600" y="630" width="390" height="190"/>
        <path class="ln thin" pathLength="1" style="animation-delay:4s" d="M600 700 H990 M600 760 H990 M800 700 V820"/>
        <text class="note big" x="624" y="677" style="animation-delay:4.2s">Red Cherry IT</text>
        <text class="note" x="624" y="740" style="animation-delay:4.4s">Drawing</text>
        <text class="note" x="824" y="740" style="animation-delay:4.4s">Home page</text>
        <text class="note" x="624" y="800" style="animation-delay:4.6s">Scale 1:1</text>
        <text class="note" x="824" y="800" style="animation-delay:4.6s">Sheet 01</text>
      </g>
    </svg>

    <div class="bar"></div>
    <h1 data-field="headline">{{headline}}</h1>
    <p class="sub" data-field="subtitle">{{subtitle}}</p>

    <div class="rule"></div>
    <div class="foot-l" data-field="footer_left">{{footer_left}}</div>
    <div class="foot-r" data-field="footer_right">{{footer_right}}</div>
  </div>
</body>
</html>
